name: BriefingPreview
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.bencbanks.briefing.prototype
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  BriefingApp:
    type: application
    platform: iOS
    sources:
      - path: BriefingApp
      - path: ../../content/topics.json
        buildPhase: resources
      - path: ../../content/editions.json
        buildPhase: resources
      - path: ../../content/deep-dives.json
        buildPhase: resources
      - path: ../../content/sources.json
        buildPhase: resources
    info:
      path: BriefingApp/Info.plist
      properties:
        CFBundleDisplayName: Briefing Preview
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    scheme:
      testTargets:
        - BriefingAppTests
  BriefingAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BriefingAppTests
      - path: dev/generated/playback-fixture.wav
        buildPhase: resources
        optional: true
    dependencies:
      - target: BriefingApp
